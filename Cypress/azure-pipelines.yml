# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- init

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '10.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'npm install'

- bash: |
      # Check if verbose mode needs to be turned on
      CMD=""
      if [ "$VERBOSE" == "true" ]
      then
        CMD="$CMD DEBUG=cypress:*"
      fi
      VERIFY_CMD="$CMD ./node_modules/.bin/cypress verify"
      RUN_CMD="$CMD ./node_modules/.bin/cypress run --browser chrome"
      # Check if Cypress record information is provided
      if [ ! -z "$CYPRESS_RECORD_KEY" ]
      then
        # Record key was set
        RUN_CMD="$RUN_CMD --record --parallel --group "chrome" --ci-build-id $BUILDID"
      fi
      eval $VERIFY_CMD
      eval $RUN_CMD
  displayName: 'Run the cypress tests'
  continueOnError: true
  env:
    TERM: xterm # Avoid terminal warnings
    VERBOSE: $(verbose)
    BUILDID: $(Build.BuildId)
    CYPRESS_RECORD_KEY: 'fa5f11a9-0859-42d7-b63f-a2c6134abd9a'
  failOnStderr: false  
    

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '*.xml'
    searchFolder: '$(System.DefaultWorkingDirectory)/cypress/reports/junit'
    mergeTestResults: true
    testRunTitle: 'Publish Test Results'
    continueOnError: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish screenshots when there were issues'
  inputs:
    pathtoPublish: '$(System.DefaultWorkingDirectory)/cypress/screenshots'
    artifactName: screenshots
    continueOnError: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish videos'
  inputs:
    pathtoPublish: '$(System.DefaultWorkingDirectory)/cypress/videos'
    artifactName: videos
    continueOnError: true