version: '3.7'

services:

  hub:
    image: selenium/hub:3.141
    ports:
      - 4444:4444
    networks:
      - my-proxy-net
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  browsermobproxy:
    image: mcopjan/browsermobproxy:latest
    ports:
      - 58081-58200:8081-8200
      - 58080:8080
    networks:
      - my-proxy-net
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  chrome:
    image: selenium/node-chrome-debug:3.141
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - my-proxy-net
    depends_on:
      - hub
    environment:
      - HUB_PORT_4444_TCP_ADDR=hub
      - HUB_PORT_4444_TCP_PORT=4444
      - NODE_MAX_SESSION=5
      - NODE_MAX_INSTANCES=5
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=24
    entrypoint: bash -c 'SE_OPTS="-host $$HOSTNAME -port 5555" /opt/bin/entry_point.sh'
    ports:
      - target:  5900
        mode: host
    deploy:
      replicas: 20
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

networks:
  my-proxy-net:
    external:
      name: custom_network   