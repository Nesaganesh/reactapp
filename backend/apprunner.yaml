version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install --production
run:
  command: npm start
  network:
    port: 5000
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "5000"
    - name: AWS_REGION
      value: us-east-1
    - name: DYNAMODB_TABLE
      value: CostumeMeasurements
  # Note: Set STRIPE_SECRET_KEY and FRONTEND_URL in App Runner Console as secrets


